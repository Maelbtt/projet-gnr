# Génère le PDF de chaque lettre mensuelle quand une lettre est publiée ou modifiée.
name: PDF des lettres

on:
  push:
    paths:
      - "docs/contenu/lettres/**.md"
      - "docs/contenu/hebdo/**.md"
      - "docs/contenu/index.json"
      - "docs/assets/style.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer le navigateur
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Générer les PDF
        run: python scripts/lettres_pdf.py
      - name: Enregistrer les PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/contenu/lettres/ docs/contenu/hebdo/
          git diff --cached --quiet && exit 0
          git commit -m "PDF des lettres : mise à jour automatique"
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
